name: Deploy FAACI

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupérer le code ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. PHP + Composer ────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Installer les dépendances Composer (prod only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── 3. Envoi des fichiers via rsync/SSH ──────────────────────────
      - name: Déployer via SSH
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST:     ${{ secrets.SSH_HOST }}
          REMOTE_USER:     ${{ secrets.SSH_USER }}
          REMOTE_PORT:     ${{ secrets.SSH_PORT }}
          SOURCE:          "./"
          TARGET:          ${{ secrets.SSH_TARGET_DIR }}
          EXCLUDE: >-
            .git,
            .github,
            .env,
            node_modules,
            storage/logs/,
            storage/framework/sessions/,
            storage/framework/cache/,
            tests/

      # ── 4. Commandes post-déploiement ────────────────────────────────
      # Décommenter après configuration du .env sur le serveur
      # - name: Post-deploy (migrate + cache)
