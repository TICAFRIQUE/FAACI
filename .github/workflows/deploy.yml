name: Deploy FAACI

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupérer le code ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. PHP + Composer ────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Installer les dépendances Composer (prod only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── 3. Envoi des fichiers via rsync natif ───────────────────────
      - name: Déployer via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          rsync -azv --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/cache/' \
            --exclude='tests/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}/

      # ── 4. Commandes post-déploiement ────────────────────────────────
